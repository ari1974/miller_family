<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Double Accelerated Math Practice</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #5c667a;
      --border: #d9deea;
      --accent: #2357c6;
      --accent-dark: #153f95;
      --danger: #9b1c1c;
      --ok: #0f6b3a;
      --warn: #8a6100;
      --shadow: 0 10px 25px rgba(20, 30, 55, 0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.45; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 20px 16px; }
    main { padding: 20px 16px 48px; }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1, h2, h3 { margin: 0 0 8px; line-height: 1.15; }
    h1 { font-size: clamp(1.6rem, 3vw, 2.35rem); }
    h2 { font-size: clamp(1.3rem, 2.4vw, 1.85rem); }
    h3 { font-size: 1.08rem; }
    p { margin: 0 0 12px; }
    .subtle { color: var(--muted); }
    .small { font-size: 0.92rem; }
    .tiny { font-size: 0.82rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
    .test-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 14px; }
    .test-card { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    button { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: white; font: inherit; font-weight: 650; border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 42px; }
    button:hover { background: var(--accent-dark); }
    button.secondary { background: white; color: var(--accent); }
    button.secondary:hover { background: #eef3ff; }
    button.danger { background: white; color: var(--danger); border-color: #d8a5a5; }
    button.danger:hover { background: #fff0f0; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .status-pill { display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 999px; background: #edf2ff; color: #263d7f; font-weight: 650; font-size: 0.86rem; }
    .status-pill.done { background: #e8f6ee; color: var(--ok); }
    .status-pill.warn { background: #fff4d6; color: var(--warn); }
    .progress-shell { height: 10px; width: 100%; background: #e8ecf5; border-radius: 999px; overflow: hidden; margin: 8px 0 2px; }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 160ms ease; }
    .question-text { font-size: clamp(1.15rem, 2.4vw, 1.55rem); margin: 16px 0; }
    label.answer-label { display: block; font-weight: 700; margin: 18px 0 6px; }
    input.answer-input { width: 100%; max-width: 560px; border: 2px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 1.1rem; }
    input.answer-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(35, 87, 198, 0.15); }
    .number-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin-top: 14px; }
    .number-grid button { min-height: 38px; padding: 6px 0; border-radius: 8px; font-size: 0.92rem; }
    .number-grid button.answered { background: #e8f6ee; color: #0f6b3a; border-color: #b5dec8; }
    .number-grid button.current { background: #172033; border-color: #172033; color: white; }
    .visual-card { margin: 14px 0; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: #fbfcff; overflow-x: auto; }
    .line-plot { border-collapse: collapse; margin: 8px auto 2px; min-width: 360px; }
    .line-plot td, .line-plot th { border: 1px solid #bfc7d8; text-align: center; padding: 5px 16px; min-width: 70px; height: 28px; }
    .line-plot th { font-weight: 800; background: #f1f4fa; }
    .line-title { text-align: center; font-weight: 800; margin-bottom: 4px; }
    .review-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .review-table th, .review-table td { border-bottom: 1px solid var(--border); padding: 8px; text-align: left; vertical-align: top; }
    .review-table th { background: #f3f5fa; }
    .correct { color: var(--ok); font-weight: 750; }
    .incorrect { color: var(--danger); font-weight: 750; }
    .notice { border: 1px solid #e7cf79; background: #fff7d6; color: #4b3a00; padding: 12px; border-radius: 12px; margin-bottom: 14px; }
    .hidden { display: none !important; }
    @media print { body { background: white; } button, .number-grid, header { display: none; } .card { box-shadow: none; border: none; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Double Accelerated Math Practice</h1>
      <p class="subtle">One problem at a time. Answers are saved on this device. Final scores and missed problem numbers are also stored in a cookie for parent review.</p>
    </div>
  </header>
  <main>
    <div class="wrap" id="app"></div>
  </main>
  <script src="math-practice.js"></script>
</body>
</html>
